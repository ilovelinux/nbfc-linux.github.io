name: Update generated files
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-data:
    runs-on: ubuntu-slim
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'
      - run: python -m pip install requests
      - run: |
          python generate.py
          cd creating-config && python generate.py
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Update generated files"
          body: |
            > [!IMPORTANT]
            > This pull request was automatically generated by a GitHub Action.

            The generated files have been updated!
          commit-message: "Update generated files"
          # reviewers: "braph"
